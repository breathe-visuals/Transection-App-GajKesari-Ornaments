<style>
*,
*::before,
*::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}
:root {
--bg: #f5f7fa;
--sidebar-bg: #0f1117;
--sidebar-width: 248px;
--topbar-h: 58px;
--accent: #0d9488;
--accent-light: #14b8a6;
--accent-glow: rgba(13, 148, 136, .18);
--text: #1a1d23;
--text-muted: #6b7280;
--text-sidebar: #c9cdd6;
--border: #e5e7eb;
--white: #ffffff;
--card: #ffffff;
--danger: #ef4444;
--warning: #f59e0b;
--success: #10b981;
--sidebar-hover: rgba(255, 255, 255, .06);
--sidebar-active: rgba(13, 148, 136, .22);
--radius: 10px;
--shadow: 0 1px 4px rgba(0, 0, 0, .08);
--shadow-md: 0 4px 16px rgba(0, 0, 0, .10);
--transition: .22s ease;
--font-main: 'Poppins', sans-serif;
--font-mono: 'Roboto', sans-serif;
}
html,
body {
height: 100%;
font-family: var(--font-main);
background: var(--bg);
color: var(--text);
overflow-x: hidden;
overscroll-behavior-y: contain;
}
a {
text-decoration: none;
color: inherit;
}
button {
cursor: pointer;
font-family: var(--font-main);
touch-action: manipulation;
}
#global-loader {
position: fixed;
inset: 0;
z-index: 9999;
background: rgba(15, 17, 23, .72);
display: flex;
align-items: center;
justify-content: center;
backdrop-filter: blur(4px);
transition: opacity .3s;
}
#global-loader.hidden {
opacity: 0;
pointer-events: none;
}
.loader-ring {
width: 52px;
height: 52px;
border: 4px solid rgba(255, 255, 255, .15);
border-top-color: var(--accent-light);
border-radius: 50%;
animation: spin .8s linear infinite;
}
@keyframes spin {
to {
transform: rotate(360deg);
}
}
#app-shell {
display: flex;
min-height: 100vh;
}
#sidebar {
width: var(--sidebar-width);
background: var(--sidebar-bg);
display: flex;
flex-direction: column;
position: fixed;
top: 0;
left: 0;
bottom: 0;
z-index: 200;
transition: transform var(--transition);
overflow: hidden;
}
#sidebar-brand {
display: flex;
align-items: center;
gap: 10px;
padding: 20px 18px 16px;
border-bottom: 1px solid rgba(255, 255, 255, .07);
}
#sidebar-brand .brand-icon {
width: 36px;
height: 36px;
border-radius: 9px;
background: linear-gradient(135deg, var(--accent), #0891b2);
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
color: #fff;
flex-shrink: 0;
}
#sidebar-brand .brand-text {
font-family: 'Montserrat', sans-serif;
font-size: 13px;
font-weight: 700;
color: #fff;
line-height: 1.3;
}
#sidebar-brand .brand-text span {
display: block;
font-size: 10px;
font-weight: 400;
color: var(--text-sidebar);
letter-spacing: .5px;
}
#sidebar-nav {
flex: 1;
overflow-y: auto;
padding: 10px 0;
scrollbar-width: thin;
scrollbar-color: rgba(255, 255, 255, .1) transparent;
}
.nav-section-label {
font-size: 9.5px;
font-weight: 600;
letter-spacing: 1.2px;
color: rgba(255, 255, 255, .28);
padding: 14px 20px 4px;
text-transform: uppercase;
}
.nav-item {
display: flex;
align-items: center;
gap: 11px;
padding: 10px 18px;
margin: 1px 8px;
border-radius: 8px;
color: var(--text-sidebar);
font-size: 13.5px;
font-weight: 400;
transition: background var(--transition), color var(--transition);
position: relative;
}
.nav-item i {
width: 18px;
text-align: center;
font-size: 14px;
flex-shrink: 0;
}
.nav-item:hover {
background: var(--sidebar-hover);
color: #fff;
}
.nav-item.active {
background: var(--sidebar-active);
color: var(--accent-light);
font-weight: 500;
}
.nav-item.active::before {
content: '';
position: absolute;
left: 0;
top: 20%;
bottom: 20%;
width: 3px;
border-radius: 0 3px 3px 0;
background: var(--accent-light);
}
#sidebar-footer {
padding: 14px 18px;
border-top: 1px solid rgba(255, 255, 255, .07);
font-size: 11px;
color: rgba(255, 255, 255, .3);
}
#main-area {
margin-left: var(--sidebar-width);
flex: 1;
display: flex;
flex-direction: column;
min-height: 100vh;
min-width: 0;
transition: margin-left var(--transition);
}
#topbar {
height: var(--topbar-h);
background: var(--white);
border-bottom: 1px solid var(--border);
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 22px;
position: sticky;
top: 0;
z-index: 100;
box-shadow: var(--shadow);
}
#topbar-left {
display: flex;
align-items: center;
gap: 12px;
}
#menu-toggle {
display: none;
background: none;
border: none;
font-size: 18px;
color: var(--text-muted);
padding: 6px;
}
#page-title {
font-family: 'Montserrat', sans-serif;
font-size: 16px;
font-weight: 700;
color: var(--text);
}
#page-breadcrumb {
font-size: 12px;
color: var(--text-muted);
}
#topbar-right {
display: flex;
align-items: center;
gap: 10px;
}
#edit-mode-btn {
display: flex;
align-items: center;
gap: 7px;
padding: 7px 14px;
border-radius: 20px;
border: 1.5px solid var(--border);
background: var(--white);
font-size: 12.5px;
font-weight: 500;
color: var(--text-muted);
transition: all var(--transition);
}
#edit-mode-btn.active {
border-color: var(--accent);
background: var(--accent-glow);
color: var(--accent);
}
#edit-mode-btn i {
font-size: 13px;
}
.toggle-dot {
width: 30px;
height: 16px;
border-radius: 8px;
background: #d1d5db;
position: relative;
transition: background var(--transition);
}
.toggle-dot::after {
content: '';
position: absolute;
left: 2px;
top: 2px;
width: 12px;
height: 12px;
border-radius: 50%;
background: #fff;
transition: transform var(--transition);
box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
}
#edit-mode-btn.active .toggle-dot {
background: var(--accent);
}
#edit-mode-btn.active .toggle-dot::after {
transform: translateX(14px);
}
#edit-mode-banner {
display: none;
padding: 7px 22px;
background: linear-gradient(90deg, rgba(13, 148, 136, .12), transparent);
border-bottom: 1px solid rgba(13, 148, 136, .2);
font-size: 12px;
color: var(--accent);
align-items: center;
gap: 8px;
}
#edit-mode-banner.show {
display: flex;
}
#edit-mode-banner i {
animation: pulse 1.6s ease infinite;
}
@keyframes pulse {
0%,
100% {
opacity: 1;
}
50% {
opacity: .4;
}
}
.topbar-btn {
width: 36px;
height: 36px;
border-radius: 50%;
border: none;
background: transparent;
color: var(--text-muted);
font-size: 15px;
display: flex;
align-items: center;
justify-content: center;
transition: background var(--transition), color var(--transition);
}
.topbar-btn:hover {
background: var(--bg);
color: var(--accent);
}
#page-content {
flex: 1;
padding: 24px;
overflow-x: hidden;
-webkit-overflow-scrolling: touch;
}
input,
select,
textarea {
min-width: 0;
max-width: 100%;
box-sizing: border-box;
}
#modal-overlay {
position: fixed;
inset: 0;
z-index: 800;
background: rgba(0, 0, 0, .45);
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
pointer-events: none;
transition: opacity .12s;
}
#modal-overlay.open {
opacity: 1;
pointer-events: all;
}
.modal-box {
background: var(--white);
border-radius: 14px;
width: 100%;
max-width: 560px;
max-height: 92vh;
display: flex;
flex-direction: column;
overflow: hidden;
box-shadow: 0 20px 60px rgba(0, 0, 0, .18);
transform: translateY(10px) scale(.98);
transition: transform .12s;
}
#modal-overlay.open .modal-box {
transform: translateY(0) scale(1);
}
.modal-header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 18px 22px;
border-bottom: 1px solid var(--border);
}
.modal-title {
font-size: 15px;
font-weight: 600;
color: var(--text);
}
.modal-close {
background: none;
border: none;
font-size: 18px;
color: var(--text-muted);
width: 32px;
height: 32px;
border-radius: 6px;
display: flex;
align-items: center;
justify-content: center;
transition: background var(--transition);
}
.modal-close:hover {
background: var(--bg);
}
.modal-body {
padding: 20px 22px;
overflow-y: auto;
flex: 1;
}
.modal-footer {
padding: 14px 22px;
border-top: 1px solid var(--border);
display: flex;
justify-content: flex-end;
gap: 10px;
flex-shrink: 0;
}
#sidebar-overlay {
display: none;
position: fixed;
inset: 0;
z-index: 199;
background: rgba(0, 0, 0, .5);
touch-action: none;
}
.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 7px;
padding: 8px 16px;
border-radius: 8px;
border: none;
font-size: 13px;
font-weight: 500;
transition: all var(--transition);
touch-action: manipulation;
-webkit-tap-highlight-color: rgba(0, 0, 0, 0.08);
user-select: none;
-webkit-user-select: none;
white-space: nowrap;
}
.btn-primary {
background: var(--accent);
color: #fff;
}
.btn-primary:hover {
background: #0f766e;
}
.btn-secondary {
background: var(--bg);
color: var(--text);
border: 1px solid var(--border);
}
.btn-secondary:hover {
background: var(--border);
}
.btn-danger {
background: var(--danger);
color: #fff;
}
.btn-danger:hover {
background: #dc2626;
}
.btn-sm {
padding: 5px 11px;
font-size: 12px;
}
body.view-only .edit-only {
display: none !important;
}
body.edit-mode .edit-only {
display: inline-flex;
}
#toast-container {
position: fixed;
bottom: 22px;
right: 22px;
z-index: 9000;
display: flex;
flex-direction: column;
gap: 8px;
}
.toast {
padding: 11px 18px;
border-radius: 9px;
font-size: 13px;
font-weight: 500;
color: #fff;
box-shadow: var(--shadow-md);
display: flex;
align-items: center;
gap: 9px;
animation: slideUp .3s ease;
min-width: 220px;
}
@keyframes slideUp {
from {
opacity: 0;
transform: translateY(12px);
}
to {
opacity: 1;
transform: translateY(0);
}
}
.toast.success {
background: #059669;
}
.toast.error {
background: #dc2626;
}
.toast.info {
background: #2563eb;
}
.toast.warning {
background: #d97706;
}
@media(max-width:768px) {
#sidebar {
transform: translateX(-100%);
}
#sidebar.open {
transform: translateX(0);
}
#sidebar-overlay.open {
display: block;
}
#main-area {
margin-left: 0;
}
#menu-toggle {
display: flex;
}
#page-content {
padding: 14px;
padding-bottom: 84px;
}
.modal-box {
width: 100%;
max-width: 100%;
height: 100%;
max-height: 100vh;
margin: 0;
border-radius: 0;
display: flex;
flex-direction: column;
}
.modal-body {
flex: 1;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
padding: 16px;
}
.app-form-grid,
div[style*="grid-template-columns: 1fr 1fr"] {
grid-template-columns: 1fr !important;
}
.btn,
.btn-primary,
.btn-secondary,
.btn-danger {
min-height: 44px;
padding: 10px 16px;
font-size: 13px;
}
.app-sel,
.app-field {
min-height: 44px;
font-size: 16px;
}
.app-table td,
.app-table th {
padding: 12px 10px;
}
.app-ab {
min-height: 40px;
padding: 8px 12px;
}
#dash-qa-panel {
display: none !important;
}
}
#qa-fab-wrap {
display: none;
position: fixed;
bottom: 20px;
right: 18px;
z-index: 600;
flex-direction: column-reverse;
align-items: flex-end;
gap: 10px;
pointer-events: none;
}
@media(max-width:768px) {
#qa-fab-wrap {
display: flex;
}
}
#qa-fab-btn {
width: 54px;
height: 54px;
border-radius: 50%;
border: none;
background: linear-gradient(135deg, #0d9488, #0891b2);
color: #fff;
font-size: 22px;
box-shadow: 0 6px 20px rgba(13, 148, 136, .45);
display: flex;
align-items: center;
justify-content: center;
transition: transform .25s ease, box-shadow .25s ease;
flex-shrink: 0;
pointer-events: auto;
}
#qa-fab-btn:hover {
box-shadow: 0 8px 28px rgba(13, 148, 136, .55);
}
#qa-fab-btn.open {
transform: rotate(45deg);
}
#qa-fab-menu {
display: flex;
flex-direction: column-reverse;
gap: 8px;
opacity: 0;
pointer-events: none;
transform: translateY(10px);
transition: opacity .12s ease, transform .12s ease;
}
#qa-fab-menu.open {
opacity: 1;
pointer-events: auto;
transform: translateY(0);
}
.qa-fab-item {
display: flex;
align-items: center;
gap: 10px;
padding: 0;
border: none;
background: transparent;
flex-direction: row-reverse;
justify-content: flex-start;
}
.qa-fab-label {
background: rgba(15, 17, 23, .85);
backdrop-filter: blur(8px);
color: #fff;
font-size: 12px;
font-weight: 500;
padding: 5px 11px;
border-radius: 20px;
white-space: nowrap;
box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
}
.qa-fab-icon {
width: 40px;
height: 40px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 15px;
color: #fff;
box-shadow: 0 3px 10px rgba(0, 0, 0, .2);
flex-shrink: 0;
}
.qa-fab-icon.ic-party {
background: #6366f1;
}
.qa-fab-icon.ic-pur {
background: #0891b2;
}
.qa-fab-icon.ic-sale {
background: #059669;
}
.qa-fab-icon.ic-rcpt {
background: #d97706;
}
.qa-fab-icon.ic-est {
background: #7c3aed;
}
#qa-fab-backdrop {
display: none;
position: fixed;
inset: 0;
z-index: 599;
touch-action: none;
pointer-events: none;
}
#qa-fab-backdrop.open {
display: block;
pointer-events: auto;
}
.confirm-dialog-icon {
width: 52px;
height: 52px;
background: linear-gradient(135deg, #fee2e2, #fecaca);
border-radius: 14px;
display: flex;
align-items: center;
justify-content: center;
font-size: 22px;
color: #dc2626;
margin: 0 auto 14px;
}
@media(max-width:480px) {
#topbar {
padding: 0 10px;
}
#page-title {
font-size: 13px;
}
#edit-mode-btn span,
#edit-mode-btn .toggle-dot {
display: none;
}
#edit-mode-btn {
padding: 6px 10px;
}
#page-content {
padding: 10px;
}
.modal-box {
margin: 16px;
width: calc(100% - 32px);
}
#pw-modal-box {
margin: 16px;
width: calc(100% - 32px);
}
#toast-container {
left: 16px;
right: 16px;
bottom: 16px;
}
.toast {
min-width: 0;
width: 100%;
box-sizing: border-box;
}
}
#gs-mobile-btn {
display: none;
background: none;
border: none;
font-size: 16px;
color: var(--text-muted);
padding: 6px 8px;
cursor: pointer;
}
#gs-mobile-btn:hover {
color: var(--accent);
}
#gs-wrap.mobile-open {
position: fixed;
top: var(--topbar-h);
left: 0;
right: 0;
max-width: none;
margin: 0;
padding: 10px 14px;
background: #fff;
border-bottom: 1px solid var(--border);
z-index: 150;
box-shadow: var(--shadow-md);
}
#gs-wrap {
position: relative;
flex: 1;
max-width: 420px;
margin: 0 16px;
}
#gs-input {
width: 100%;
padding: 7px 14px 7px 36px;
border: 1.5px solid var(--border);
border-radius: 22px;
font-family: var(--font-main);
font-size: 13px;
outline: none;
background: var(--bg);
color: var(--text);
transition: border-color var(--transition), box-shadow var(--transition);
}
#gs-input:focus {
border-color: var(--accent);
box-shadow: 0 0 0 3px rgba(13, 148, 136, .12);
background: #fff;
}
#gs-icon {
position: absolute;
left: 11px;
top: 50%;
transform: translateY(-50%);
color: var(--text-muted);
font-size: 13px;
pointer-events: none;
}
#gs-spinner {
position: absolute;
right: 11px;
top: 50%;
transform: translateY(-50%);
width: 14px;
height: 14px;
border: 2px solid rgba(13, 148, 136, .2);
border-top-color: var(--accent);
border-radius: 50%;
animation: gsSpin .6s linear infinite;
display: none;
}
@keyframes gsSpin {
from {
transform: translateY(-50%) rotate(0deg);
}
to {
transform: translateY(-50%) rotate(360deg);
}
}
#gs-dropdown {
display: none;
position: absolute;
top: calc(100% + 6px);
left: 0;
right: 0;
background: #fff;
border: 1px solid var(--border);
border-radius: 12px;
box-shadow: var(--shadow-md);
max-height: 420px;
overflow-y: auto;
z-index: 3000;
animation: gsFadeIn .15s ease;
}
@keyframes gsFadeIn {
from {
opacity: 0;
transform: translateY(-4px)
}
to {
opacity: 1;
transform: none
}
}
#gs-dropdown.open {
display: block;
}
.gs-group-title {
padding: 8px 14px 4px;
font-size: 10.5px;
font-weight: 700;
color: var(--accent);
text-transform: uppercase;
letter-spacing: .5px;
border-top: 1px solid #f3f4f6;
}
.gs-group-title:first-child {
border-top: none;
}
.gs-item {
display: flex;
align-items: center;
gap: 10px;
padding: 9px 14px;
cursor: pointer;
transition: background var(--transition);
font-size: 13px;
}
.gs-item:hover,
.gs-item.focused {
background: #f0fdf9;
}
.gs-item-icon {
width: 28px;
height: 28px;
border-radius: 7px;
display: flex;
align-items: center;
justify-content: center;
font-size: 12px;
flex-shrink: 0;
}
.gs-ic-party {
background: rgba(13, 148, 136, .12);
color: #0d9488
}
.gs-ic-pur {
background: rgba(37, 99, 235, .12);
color: #2563eb
}
.gs-ic-sale {
background: rgba(16, 185, 129, .12);
color: #059669
}
.gs-ic-pay {
background: rgba(245, 158, 11, .12);
color: #d97706
}
.gs-ic-est {
background: rgba(139, 92, 246, .12);
color: #7c3aed
}
.gs-item-main {
flex: 1;
min-width: 0;
}
.gs-item-title {
font-weight: 600;
color: var(--text);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.gs-item-sub {
font-size: 11.5px;
color: var(--text-muted);
margin-top: 1px;
}
.gs-empty {
padding: 20px 14px;
text-align: center;
color: var(--text-muted);
font-size: 13px;
}
.gs-footer {
padding: 8px 14px;
border-top: 1px solid #f3f4f6;
font-size: 11px;
color: var(--text-muted);
text-align: center;
}
@media(max-width:768px) {
#gs-wrap {
max-width: none;
margin: 0 8px;
}
}
@media(max-width:540px) {
#gs-wrap {
display: none;
}
#gs-mobile-btn {
display: flex !important;
align-items: center;
justify-content: center;
}
#gs-wrap.mobile-open {
display: block !important;
position: absolute;
top: 100%;
left: 0;
right: 0;
margin: 0;
padding: 12px 16px;
background: var(--white);
border-top: 1px solid var(--border);
box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
z-index: 1000;
}
#gs-wrap.mobile-open #gs-icon {
left: 27px;
}
#gs-wrap.mobile-open #gs-spinner {
right: 27px;
}
}
#pw-modal-overlay {
position: fixed;
inset: 0;
z-index: 9500;
background: rgba(15, 17, 23, .65);
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
pointer-events: none;
transition: opacity .22s;
backdrop-filter: blur(6px);
}
#pw-modal-overlay.open {
opacity: 1;
pointer-events: all;
}
#pw-modal-box {
background: #fff;
border-radius: 16px;
width: 100%;
max-width: 370px;
padding: 32px 28px 24px;
box-shadow: 0 24px 64px rgba(0, 0, 0, .22);
transform: translateY(20px) scale(.97);
transition: transform .22s;
text-align: center;
}
#pw-modal-overlay.open #pw-modal-box {
transform: translateY(0) scale(1);
}
.pw-lock-icon {
width: 56px;
height: 56px;
background: linear-gradient(135deg, #0d9488, #0891b2);
border-radius: 16px;
display: flex;
align-items: center;
justify-content: center;
font-size: 24px;
color: #fff;
margin: 0 auto 16px;
}
.pw-title {
font-family: 'Montserrat', sans-serif;
font-size: 17px;
font-weight: 700;
color: #1a1d23;
margin-bottom: 6px;
}
