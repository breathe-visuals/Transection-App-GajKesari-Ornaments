<div class="app-overlay" id="saleOv">
  <div class="app-spin"></div>
  <div class="app-spin-txt" id="saleOvT">Processing...</div>
</div>
<div class="app-header">
  <div class="app-title"><i class="fas fa-hand-holding-usd" style="color:var(--accent);margin-right:8px"></i>Sales</div>
  <div class="app-subtitle">Add and manage sales entries</div>
</div>
<div class="app-bar">
  <!-- Row 1: Action buttons -->
  <div class="app-bar-left">
    <button class="btn btn-primary edit-only" onclick="saleOpenAdd()"><i class="fas fa-plus"></i> New Sale</button>
    <button class="btn btn-danger" id="saleDelRow" style="display:none" onclick="saleDeleteSelected()"><i
        class="fas fa-trash"></i> Delete Selected (<span id="saleSelCount">0</span>)</button>
  </div>
  <!-- Row 2: Search bar -->
  <div class="app-bar-search">
    <div class="app-search-wrap">
      <i class="fas fa-search app-search-icon"></i>
      <input class="app-search-inp" id="saleSrchQ" type="text" placeholder="Search sales..."
        onkeydown="if(event.key==='Enter')saleSearch()" oninput="saleToggleClear()" />
      <button class="app-search-clear" id="saleClearBtn" onclick="saleClear()" title="Clear" style="display:none"><i
          class="fas fa-xmark"></i></button>
      <button class="app-search-btn" onclick="saleSearch()" title="Search"><i class="fas fa-search"></i></button>
    </div>
  </div>
  <!-- Row 3: Sort & Print -->
  <div class="app-bar-print">
    <select class="app-sel" id="saleSrchCrit">
      <option value="all">All Fields</option>
      <option value="0">Sale ID</option>
      <option value="3">Party Name</option>
      <option value="4">Area</option>
    </select>
    <button class="btn btn-secondary" onclick="salePrint()"><i class="fas fa-print"></i> Print Sales List</button>
  </div>
</div>

<div class="app-wrap">
  <div class="app-thead"><span class="app-thead-title"><i class="fas fa-table"
        style="color:var(--accent);margin-right:6px"></i>Sales
      List</span><span class="app-count" id="saleCnt">Loading...</span></div>
  <div class="app-scroll">
    <table id="saleTable" class="app-table">
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="saleSelAll" onchange="saleToggleAll(this)"
              title="Select all" /></th>
          <th>#</th>
          <th>Sale ID</th>
          <th>Date</th>
          <th>Party ID</th>
          <th>Party Name</th>
          <th>Area</th>
          <th>Grams</th>
          <th>Rupees</th>
          <th>Rate/10g</th>
          <th>Avg Rate</th>
          <th>Profit ₹</th>
          <th>Profit %</th>
          <th>Stock (g)</th>
          <th>Paid</th>
          <th>Note</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="saleTbody"></tbody>
    </table>
  </div>
  <div class="app-pag" id="salePag"></div>
</div>
<script>
  /* empty”€empty”€ State empty”€empty”€ */
  var salePageData = [], saleTotalRecords = 0, salePage = 1, salePageSize = 25, saleEditing = null, saleParties = [], saleCombo = null;
  var saleSearchCol = 'all', saleSearchQ = '';
  var _saleOvTimer = null;

  function saleShowOv(t) { document.getElementById('saleOvT').textContent = t || 'Processing...'; document.getElementById('saleOv').classList.add('show'); if (_saleOvTimer) clearTimeout(_saleOvTimer); _saleOvTimer = setTimeout(function () { saleHideOv(); }, 15000); }
  function saleHideOv() { if (_saleOvTimer) { clearTimeout(_saleOvTimer); _saleOvTimer = null; } document.getElementById('saleOv').classList.remove('show'); }

  function saleLoad() { salePage = 1; saleSearchCol = 'all'; saleSearchQ = ''; var q = document.getElementById('saleSrchQ'), c = document.getElementById('saleSrchCrit'); if (q) q.value = ''; if (c) c.value = 'all'; saleLoadPage(1); }
  function saleLoadPage(page) {
    salePage = page; document.getElementById('saleCnt').textContent = 'Loading...';
    if (typeof API === 'undefined') { salePageData = []; saleTotalRecords = 0; saleRender(); return; }
    API.run.withSuccessHandler(function (r) { if (r && r.success) { salePageData = r.data || []; saleTotalRecords = r.total || 0; salePageSize = r.pageSize || salePageSize; saleRender(); } else { salePageData = []; saleTotalRecords = 0; saleRender(); showToast((r && r.message) || 'Load failed', 'error'); } })
      .withFailureHandler(function (e) { salePageData = []; saleTotalRecords = 0; saleRender(); showToast((e && e.message) || 'Load error', 'error'); })
      .saleGetPage({ page: salePage, pageSize: salePageSize, searchCol: saleSearchCol, searchQ: saleSearchQ });
  }
  function saleLoadParties(cb) { if (saleParties.length) { cb && cb(); return; } try { API.run.withSuccessHandler(function (r) { if (r && r.success) saleParties = r.data || []; cb && cb(); }).withFailureHandler(function () { cb && cb(); }).saleGetPartiesForDropdown(); } catch (ex) { cb && cb(); } }

  function saleRender() {
    var tb = document.getElementById('saleTbody'), tot = saleTotalRecords;
    document.getElementById('saleCnt').textContent = tot + ' record' + (tot !== 1 ? 's' : '');
    if (!salePageData.length) { tb.innerHTML = '<tr><td colspan="17" class="app-no-data"><i class="fas fa-inbox" style="font-size:28px;display:block;margin-bottom:8px;color:#d1d5db"></i>No records found</td></tr>'; saleRenderPagination(0); return; }
    var rows = '';
    for (var i = 0; i < salePageData.length; i++) {
      var d = salePageData[i], sn = (salePage - 1) * salePageSize + i + 1;
      rows += '<tr id="app-form-grid-' + _htmlEsc(d.saleId) + '">'
        + '<td><input type="checkbox" class="sale-chk" value="' + _htmlEsc(d.saleId) + '" onchange="saleChkChange()"/></td>'
        + '<td>' + sn + '</td>'
        + '<td><code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;font-size:11px">' + _htmlEsc(d.saleId) + '</code></td>'
        + '<td class="sl-cd">' + _htmlEsc(d.date) + '</td>'
        + '<td>' + _htmlEsc(d.partyId) + '</td>'
        + '<td class="sl-cpn">' + _htmlEsc(d.partyName) + '</td>'
        + '<td class="sl-ca">' + _htmlEsc(d.area) + '</td>'
        + '<td class="sl-cg">' + _htmlEsc(d.grams) + '</td>'
        + '<td class="sl-cr">' + _htmlEsc(d.rupees) + '</td>'
        + '<td>' + _htmlEsc(d.saleRate10g) + '</td>'
        + '<td>' + _htmlEsc(d.avgPurRate) + '</td>'
        + '<td>' + _htmlEsc(d.profitRupees) + '</td>'
        + '<td>' + _htmlEsc(d.profitPct) + '%</td>'
        + '<td>' + _htmlEsc(d.stockBalGrams) + '</td>'
        + '<td style="text-align:center">' + (d.isPaid ? '<span class="app-badge" style="background:#dcfce7;color:#166534;border:1px solid #86efac"><i class="fas fa-check" style="margin-right:3px"></i>Paid</span>' : '<span style="color:#9ca3af;font-size:12px">—</span>') + '</td>'
        + '<td class="sl-cn">' + _htmlEsc(d.note) + '</td>'
        + '<td style="min-width:160px">'
        + '<div id="sl-v-' + _htmlEsc(d.saleId) + '" style="display:flex;gap:5px">'
        + '<button class="app-ab app-edit edit-only" onclick="saleStartEdit(\'' + _htmlEsc(d.saleId) + '\')"><i class="fas fa-pen"></i> Edit</button>'
        + '<button class="app-ab app-del edit-only" onclick="saleConfirmDel(\'' + _htmlEsc(d.saleId) + '\')"><i class="fas fa-trash"></i> Delete</button>'
        + '</div>'
        + '<div id="sl-ea-' + _htmlEsc(d.saleId) + '" style="display:none;gap:5px">'
        + '<button class="app-ab app-upd" onclick="saleDoUpdate(\'' + _htmlEsc(d.saleId) + '\')"><i class="fas fa-check"></i> Update</button>'
        + '<button class="app-ab app-can" onclick="saleCancelEdit(\'' + _htmlEsc(d.saleId) + '\')"><i class="fas fa-xmark"></i> Cancel</button>'
        + '</div></td></tr>';
    }
    tb.innerHTML = rows; saleRenderPagination(tot);
  }

  function saleRenderPagination(tot) {
    if (typeof UI !== 'undefined') UI.renderPagination(tot, salePage, salePageSize, 'salePag', 'saleGoPage');
    else document.getElementById('salePag').innerHTML = '';
  }
  function saleGoPage(p) { var pages = Math.ceil(saleTotalRecords / salePageSize) || 1; p = Math.max(1, Math.min(p, pages)); if (p === salePage) return; saleLoadPage(p); }

  function saleSearch() { saleSearchQ = document.getElementById('saleSrchQ').value.trim().toLowerCase(); saleSearchCol = document.getElementById('saleSrchCrit').value; saleLoadPage(1); }
  function saleClear() {
    document.getElementById('saleSrchQ').value = '';
    document.getElementById('saleSrchCrit').value = 'all';
    var cb = document.getElementById('saleClearBtn'); if (cb) cb.style.display = 'none';
    saleSearchQ = ''; saleSearchCol = 'all'; saleLoadPage(1);
  }
  function saleToggleClear() {
    var v = document.getElementById('saleSrchQ').value;
    var cb = document.getElementById('saleClearBtn');
    if (cb) cb.style.display = v ? 'inline-flex' : 'none';
  }

  function saleOpenAdd() {
    if (!APP.editMode) { showToast('Enable Edit Mode first', 'warning'); return; }
    saleLoadParties(function () {
      var b = '<div class="app-fg"><label class="app-label">Sale ID</label><div class="app-id-row"><input class="app-field" id="sfId" readonly placeholder="Click Generate"/><button class="btn btn-secondary btn-sm" onclick="saleGenId()"><i class="fas fa-rotate-right"></i> Generate</button></div></div>'
        + '<div class="app-form-grid"><div class="app-fg"><label class="app-label">Date *</label><input class="app-field" id="sfDate" type="date"/></div>'
        + '<div class="app-fg"><label class="app-label">Party Name *</label><div id="sfPNWrap"></div></div></div>'
        + '<div class="app-form-grid"><div class="app-fg"><label class="app-label">Party ID</label><input class="app-field" id="sfPID" readonly/></div>'
        + '<div class="app-fg"><label class="app-label">Area</label><input class="app-field" id="sfArea" readonly/></div></div>'
        + '<div class="app-form-grid"><div class="app-fg"><label class="app-label">Grams *</label><input class="app-field" id="sfG" type="number" step="0.001" oninput="saleCalc()"/></div>'
        + '<div class="app-fg"><label class="app-label">Rupees *</label><input class="app-field" id="sfR" type="number" step="0.01" oninput="saleCalc()"/></div></div>'
        + '<div class="app-form-grid"><div class="app-fg"><label class="app-label">Sale Rate/10g (Auto)</label><input class="app-field" id="sfRate" readonly/></div>'
        + '<div class="app-fg"><label class="app-label">Avg Purchase Rate <small style="color:#0d9488;font-weight:500">(Auto / Override)</small></label><input class="app-field" id="sfAvg" type="number" step="0.01" oninput="saleCalc()" placeholder="Auto from purchases - edit to override"/></div></div>'
        + '<div class="app-form-grid"><div class="app-fg"><label class="app-label">Profit ₹ (Auto)</label><input class="app-field" id="sfProR" readonly/></div>'
        + '<div class="app-fg"><label class="app-label">Profit % (Auto)</label><input class="app-field" id="sfProP" readonly/></div></div>'
        + '<div class="app-fg"><label class="app-label">Stock Balance g (Auto)</label><input class="app-field" id="sfStock" readonly placeholder="Calculated on save"/></div>'
        + '<div class="app-fg"><label class="app-label">Note</label><input class="app-field" id="sfNote" type="text" placeholder="Optional"/></div>'
        + '<div class="app-fg" style="margin-top:10px;"><label class="app-label" style="display:flex;align-items:center;cursor:pointer;"><input type="checkbox" id="sfIsPaid" style="margin-right:8px;width:18px;height:18px;cursor:pointer;accent-color:var(--accent);"> <span style="font-size:14px;font-weight:500;color:#1a1d23">Mark as Paid (Skip adding to Outstanding)</span></label></div>';
      openModal('Add New Sale', b, '<button class="btn btn-secondary" onclick="closeModal()"><i class="fas fa-xmark"></i> Close</button><button class="btn btn-primary" onclick="saleSaveNew()"><i class="fas fa-save"></i> Save</button>');
      var td = new Date(), mm = String(td.getMonth() + 1).padStart(2, '0'), dd = String(td.getDate()).padStart(2, '0');
      document.getElementById('sfDate').value = td.getFullYear() + '-' + mm + '-' + dd;
      /* build searchable party combobox */
      var wrap = document.getElementById('sfPNWrap');
      if (wrap) {
        saleCombo = makePartyCombo({
          wrap: wrap,
          inputId: 'sfPN',
          parties: saleParties,
          placeholder: 'Type to search party...',
          onSelect: function (p) {
            document.getElementById('sfPID').value = p ? p.partyId : '';
            document.getElementById('sfArea').value = p ? p.area : '';
          }
        });
      }
      saleGenId(); saleLoadCalc();
    });
  }
  function saleFetchParty() { /* now handled by combobox onSelect */ }
  function saleLoadCalc() {
    API.run
      .withSuccessHandler(function (r) {
        if (r && r.success) {
          document.getElementById('sfAvg').value = r.avgRate || 0;
          saleCalc();
        } else {
          showToast((r && r.message) || 'Could not load sale calculation data', 'warning');
        }
      })
      .withFailureHandler(function (e) {
        showToast((e && e.message) || 'Could not load sale calculation data', 'warning');
      })
      .saleGetCalcData();
  }
  function saleCalc() {
    var g = parseFloat(document.getElementById('sfG').value) || 0, r = parseFloat(document.getElementById('sfR').value) || 0;
    var avg = parseFloat(document.getElementById('sfAvg').value) || 0;
    var rate = g > 0 ? Math.round((r / g) * 10 * 100) / 100 : 0;
    var cost = Math.round((avg / 10) * g * 100) / 100;
    var profR = Math.round((r - cost) * 100) / 100;
    var profP = cost > 0 ? Math.round((profR / cost) * 100 * 100) / 100 : 0;
    document.getElementById('sfRate').value = rate || '';
    document.getElementById('sfProR').value = profR || '';
    document.getElementById('sfProP').value = profP || '';
  }
  function saleGenId() {
    document.getElementById('sfId').value = 'S' + Math.floor(10000 + Math.random() * 90000);
  }
  function saleSaveNew() {
    var id = document.getElementById('sfId').value.trim(), dt = document.getElementById('sfDate').value;
    var pn = saleCombo ? saleCombo.getValue() : '';
    var g = document.getElementById('sfG').value, r = document.getElementById('sfR').value;
    if (!id) { showToast('Generate a Sale ID first', 'warning'); return; }
    if (!dt) { showToast('Date is required', 'warning'); return; }
    if (!pn) { showToast('Select a Party', 'warning'); return; }
    if (!saleCombo || !saleCombo.getSelected()) { showToast('Please select a party from the dropdown list', 'warning'); return; }
    if (!g || parseFloat(g) <= 0) { showToast('Grams must be > 0', 'warning'); return; }
    if (!r || parseFloat(r) <= 0) { showToast('Rupees must be > 0', 'warning'); return; }
    closeModal(); saleShowOv('Saving...');
    API.run.withSuccessHandler(function (res) { saleHideOv(); if (res && res.success) { showToast('New Sale Added', 'success'); saleLoad(); } else showToast((res && res.message) || 'Save failed', 'error'); })
      .withFailureHandler(function (e) { saleHideOv(); showToast(e.message, 'error'); })
      .saleAddSale({ saleId: id, date: dt, partyId: document.getElementById('sfPID').value, partyName: pn, area: document.getElementById('sfArea').value, grams: g, rupees: r, avgPurRate: parseFloat(document.getElementById('sfAvg').value) || 0, note: document.getElementById('sfNote').value.trim(), isPaid: document.getElementById('sfIsPaid') ? document.getElementById('sfIsPaid').checked : false });
  }

  /* empty”€empty”€ Inline Edit empty”€empty”€ */
  function saleStartEdit(id) {
    if (saleEditing && saleEditing !== id) { showToast('Please save or cancel the current edit first.', 'warning'); return; } saleEditing = id;
    var d = salePageData.find(function (x) { return x.saleId === id; }); if (!d) return;
    saleLoadParties(function () {
      saleShowOv('Loading...');
      setTimeout(function () {
        var row = document.getElementById('app-form-grid-' + id); if (!row) { saleHideOv(); return; }
        row.classList.add('app-editing');
        var tdD = row.querySelector('.sl-cd'); tdD.setAttribute('data-orig', tdD.innerHTML); tdD.innerHTML = '<input class="app-edit-inp" type="date" value="' + _htmlEsc(d.dateRaw) + '"/>';
        var opts = saleParties.map(function (p) { return '<option value="' + _htmlEsc(p.partyName) + '" data-id="' + _htmlEsc(p.partyId) + '" data-area="' + _htmlEsc(p.area) + '"' + (p.partyName === d.partyName ? ' selected' : '') + '>' + _htmlEsc(p.partyName) + '</option>'; }).join('');
        var tdP = row.querySelector('.sl-cpn'); tdP.setAttribute('data-orig', tdP.innerHTML); tdP.innerHTML = '<select class="app-edit-inp" onchange="saleEditPC(\'' + id + '\',this)"><option value="">Select...</option>' + opts + '</select>';
        var tdA = row.querySelector('.sl-ca'); tdA.setAttribute('data-orig', tdA.innerHTML);
        [['sl-cg', d.grams, 'number'], ['sl-cr', d.rupees, 'number'], ['sl-cn', d.note, 'text']].forEach(function (x) {
          var td = row.querySelector('.' + x[0]); td.setAttribute('data-orig', td.innerHTML); td.innerHTML = '<input class="app-edit-inp" type="' + x[2] + '" value="' + _htmlEsc(String(x[1] || '')) + '"/>';
        });
        document.getElementById('sl-v-' + id).style.display = 'none'; document.getElementById('sl-ea-' + id).style.display = 'flex'; saleHideOv();
      }, 150);
    });
  }
  function saleEditPC(rowId, sel) { var opt = sel.options[sel.selectedIndex]; var row = document.getElementById('app-form-grid-' + rowId); if (row) { var td = row.querySelector('.sl-ca'); td.textContent = opt ? opt.getAttribute('data-area') : ''; } }
  function saleCancelEdit(id) {
    var row = document.getElementById('app-form-grid-' + id); if (!row) return;
    row.classList.remove('app-editing');
    ['sl-cd', 'sl-cpn', 'sl-ca', 'sl-cg', 'sl-cr', 'sl-cn'].forEach(function (c) { var td = row.querySelector('.' + c); if (td && td.getAttribute('data-orig') !== null) td.innerHTML = td.getAttribute('data-orig'); });
    document.getElementById('sl-v-' + id).style.display = 'flex'; document.getElementById('sl-ea-' + id).style.display = 'none'; saleEditing = null;
  }
  function slGC(row, cls) { var td = row.querySelector('.' + cls); if (!td) return ''; var el = td.querySelector('input') || td.querySelector('select'); return el ? el.value : td.textContent; }
  function saleDoUpdate(id) {
    var row = document.getElementById('app-form-grid-' + id); if (!row) return;
    var dt = slGC(row, 'sl-cd'), pn = slGC(row, 'sl-cpn'), g = slGC(row, 'sl-cg'), r = slGC(row, 'sl-cr');
    if (!dt) { showToast('Date is required', 'warning'); return; }
    if (!pn) { showToast('Party Name is required', 'warning'); return; }
    if (!g || parseFloat(g) <= 0) { showToast('Grams required', 'warning'); return; }
    if (!r || parseFloat(r) <= 0) { showToast('Rupees required', 'warning'); return; }
    var party = saleParties.find(function (p) { return p.partyName === pn; }) || {};
    saleShowOv('Updating...');
    var origData = salePageData.find(function (x) { return x.saleId === id; }) || {};
    API.run.withSuccessHandler(function (res) { saleHideOv(); if (res && res.success) { showToast('Sale Updated', 'success'); saleEditing = null; saleLoadPage(salePage); } else showToast((res && res.message) || 'Update failed', 'error'); })
      .withFailureHandler(function (e) { saleHideOv(); showToast(e.message, 'error'); })
      .saleUpdateSale({ saleId: id, date: dt, partyId: party.partyId || '', partyName: pn, area: party.area || slGC(row, 'sl-ca'), grams: g, rupees: r, note: slGC(row, 'sl-cn'), isPaid: !!origData.isPaid });
  }
  function saleConfirmDel(id) {
    var d = salePageData.find(function (x) { return x.saleId === id; });
    confirmDialog('Delete sale <strong>' + _htmlEsc(id) + '</strong>' + (d ? ' (' + _htmlEsc(d.partyName) + ')?' : '?'), function () {
      saleShowOv('Deleting...');
      API.run.withSuccessHandler(function (res) { saleHideOv(); if (res && res.success) { showToast('Sale Deleted', 'success'); saleLoadPage(salePage); } else showToast((res && res.message) || 'Delete failed', 'error'); })
        .withFailureHandler(function (e) { saleHideOv(); showToast(e.message, 'error'); }).saleDeleteSale(id);
    });
  }
  APP.reload = saleLoad;
  APP.openAdd = { sale: saleOpenAdd };

  function saleToggleAll(cb) { document.querySelectorAll('.sale-chk').forEach(function (c) { c.checked = cb.checked; }); saleChkChange(); }
  function saleChkChange() {
    var sel = document.querySelectorAll('.sale-chk:checked').length;
    var row = document.getElementById('saleDelRow');
    var sc = document.getElementById('saleSelCount');
    if (row) row.style.display = (APP.editMode && sel > 0) ? 'block' : 'none';
    if (sc) sc.textContent = sel;
  }
  function saleDeleteSelected() {
    if (!APP.editMode) { showToast('Enable Edit Mode first', 'warning'); return; }
    var ids = []; document.querySelectorAll('.sale-chk:checked').forEach(function (c) { ids.push(c.value); });
    if (!ids.length) { showToast('No sales selected', 'warning'); return; }
    confirmDialog('Delete <strong>' + ids.length + '</strong> selected sale(s)? Outstanding balances will be reversed.', function () {
      saleShowOv('Deleting ' + ids.length + ' sale(s)...');
      API.run.withSuccessHandler(function (res) { saleHideOv(); showToast(res.message || 'Done', 'success'); saleLoadPage(salePage); })
        .withFailureHandler(function (e) { saleHideOv(); showToast(e.message, 'error'); }).saleBulkDelete(ids);
    });
  }

  /* empty”€empty”€ Print empty”€empty”€ */
  function salePrint() {
    var total = Math.max(parseInt(saleTotalRecords || 0, 10), (salePageData || []).length);
    if (!total) { showToast('No data to print', 'warning'); return; }
    API.run
      .withSuccessHandler(function (r) {
        var rows = (r && r.success) ? (r.data || []) : (salePageData || []);
        salePrintRows(rows);
      })
      .withFailureHandler(function () { salePrintRows(salePageData || []); })
      .saleGetPage({ page: 1, pageSize: Math.max(total, salePageSize || 25), searchCol: saleSearchCol, searchQ: saleSearchQ });
  }

  function salePrintRows(printRows) {
    if (!printRows || !printRows.length) { showToast('No data to print', 'warning'); return; }
    var totalG = 0, totalR = 0, totalPL = 0;
    var rows = printRows.map(function (d, i) {
      totalG += parseFloat(d.grams) || 0; totalR += parseFloat(d.rupees) || 0; totalPL += parseFloat(d.profitRupees) || 0;
      var sn = i + 1;
      var plColor = (parseFloat(d.profitRupees) || 0) >= 0 ? 'color:var(--success)' : 'color:var(--danger)';
      return '<tr><td>' + sn + '</td><td><code>' + _htmlEsc(d.saleId) + '</code></td><td>' + _htmlEsc(d.date) + '</td><td>' + _htmlEsc(d.partyName) + '</td><td>' + _htmlEsc(d.area) + '</td>'
        + '<td class="num">' + (parseFloat(d.grams) || 0).toFixed(3) + ' g</td><td class="num">&#8377; ' + (parseFloat(d.rupees) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 }) + '</td>'
        + '<td class="num">' + _htmlEsc(d.saleRate10g) + '</td><td class="num" style="' + plColor + '">&#8377; ' + (parseFloat(d.profitRupees) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 }) + '</td><td>' + _htmlEsc(d.note || '') + '</td></tr>';
    }).join('');
    var foot = '<tr><td colspan="5"><strong>Totals (' + printRows.length + ' records)</strong></td><td class="num"><strong>' + totalG.toFixed(3) + ' g</strong></td><td class="num"><strong>&#8377; ' + totalR.toLocaleString('en-IN', { minimumFractionDigits: 2 }) + '</strong></td><td></td><td class="num"><strong>&#8377; ' + totalPL.toLocaleString('en-IN', { minimumFractionDigits: 2 }) + '</strong></td><td></td></tr>';
