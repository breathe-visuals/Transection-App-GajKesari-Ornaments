<script>
  const UI = {
    showOverlay: function (overlayId, textId, text) {
      var txtEl = document.getElementById(textId);
      if (txtEl) txtEl.textContent = text || 'Processing...';
      var ov = document.getElementById(overlayId);
      if (ov) ov.classList.add('show');
    },
    hideOverlay: function (overlayId) {
      var ov = document.getElementById(overlayId);
      if (ov) ov.classList.remove('show');
    },
    renderPagination: function (total, page, pageSize, wrapperId, callbackName) {
      var pages = Math.ceil(total / pageSize) || 1;
      var pag = document.getElementById(wrapperId);
      if (!pag) return;
      if (pages <= 1 && total <= pageSize) { pag.innerHTML = ''; return; }
      var start = (page - 1) * pageSize + 1;
      var end = Math.min(page * pageSize, total);
      var html = '<span class="app-pag-info">Showing ' + start + '-' + end + ' of ' + total + '</span><div class="app-pag-btns">';
      html += '<button class="app-pag-btn" onclick="' + callbackName + '(' + (page - 1) + ')" ' + (page === 1 ? 'disabled' : '') + '>< Prev</button>';
      var lo = Math.max(1, page - 2);
      var hi = Math.min(pages, page + 2);
      for (var p = lo; p <= hi; p++) {
        var active = (p === page) ? ' active' : '';
        html += '<button class="app-pag-btn' + active + '" onclick="' + callbackName + '(' + p + ')">' + p + '</button>';
      }
      html += '<button class="app-pag-btn" onclick="' + callbackName + '(' + (page + 1) + ')" ' + (page === pages ? 'disabled' : '') + '>Next ></button></div>';
      pag.innerHTML = html;
    },
    renderForm: function (config) {
      var html = '<div class="app-form-grid">';
      for (var i = 0; i < config.fields.length; i++) {
        var f = config.fields[i];
        var full = f.full ? ' full' : '';
        html += '<div class="app-fg' + full + '">';
        html += '<label class="app-label">' + (f.icon ? '<i class="' + f.icon + '"></i> ' : '') + f.label + '</label>';
        if (f.custom) {
          html += f.custom;
        } else if (f.type === 'select') {
          html += '<select class="app-field" id="' + f.id + '">';
          html += '<option value="">Select...</option>';
          for (var j = 0; j < f.options.length; j++) {
            html += '<option value="' + f.options[j] + '">' + f.options[j] + '</option>';
          }
          html += '</select>';
        } else {
          var ro = f.readonly ? ' readonly' : '';
          var ph = f.placeholder ? ' placeholder="' + f.placeholder + '"' : '';
          var ttl = f.title ? ' title="' + f.title + '"' : '';
          html += '<input class="app-field" id="' + f.id + '" type="' + f.type + '"' + ph + ro + ttl + ' />';
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    },
    renderTable: function (containerId, config) {
      var container = document.getElementById(containerId);
      if (!container) return;
      var html = '<div class="app-wrap">';
      if (config.title) {
        html += '<div class="app-thead">';
        html += '<span class="app-thead-title">' + (config.icon ? '<i class="' + config.icon + '" style="color:#0d9488;margin-right:6px"></i>' : '') + config.title + '</span>';
        if (config.countId) {
          html += '<span class="app-count" id="' + config.countId + '">Loading...</span>';
        }
        html += '</div>';
      }
      html += '<div class="app-scroll">';
      html += '<table id="' + (config.tableId || 'appTable') + '" class="app-table">';
      html += '<thead><tr>';
      if (config.selectable) {
        html += '<th style="width:36px"><input type="checkbox" id="' + (config.selectAllId || 'selAll') + '" onchange="if(typeof ' + config.onSelectAll + ' === \'function\') ' + config.onSelectAll + '(this)" title="Select all" /></th>';
      }
      if (config.showIndex) { html += '<th>#</th>'; }
      for (var i = 0; i < config.columns.length; i++) {
        html += '<th>' + (config.columns[i].label || '') + '</th>';
      }
      if (config.actions) { html += '<th>Actions</th>'; }
      html += '</tr></thead>';
      html += '<tbody id="' + (config.tbodyId || 'appTbody') + '"></tbody>';
      html += '</table></div>';
      if (config.paginationId) {
        html += '<div class="app-pag" id="' + config.paginationId + '"></div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }
  };
  function showLoader() {
    document.getElementById('global-loader').classList.remove('hidden');
  }
  function hideLoader() {
    document.getElementById('global-loader').classList.add('hidden');
  }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }
  window.addEventListener('resize', function () {
    if (window.innerWidth > 768) closeSidebar();
  });
  function setActiveNav(page) {
    document.querySelectorAll('.nav-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.page === page);
    });
  }
  var _qaFabOpen = false;
  function toggleQaFab() {
    _qaFabOpen ? closeQaFab() : openQaFab();
  }
  function openQaFab() {
    _qaFabOpen = true;
    document.getElementById('qa-fab-btn').classList.add('open');
    document.getElementById('qa-fab-menu').classList.add('open');
    document.getElementById('qa-fab-backdrop').classList.add('open');
  }
  function closeQaFab() {
    _qaFabOpen = false;
    document.getElementById('qa-fab-btn').classList.remove('open');
    document.getElementById('qa-fab-menu').classList.remove('open');
    document.getElementById('qa-fab-backdrop').classList.remove('open');
  }
  var QA_MAP = {
    party: { page: 'parties', key: 'party' },
    purchase: { page: 'purchase', key: 'purchase' },
    sale: { page: 'sales', key: 'sale' },
    payment: { page: 'payments', key: 'payment' },
    invoice: { page: 'invoice', key: 'invoice' }
  };
  function qaFabAction(type) {
    closeQaFab();
    if (typeof APP !== 'undefined' && APP.openAdd && typeof APP.openAdd[type] === 'function') {
      APP.openAdd[type]();
      return;
    }
    if (type === 'invoice') {
      var target = QA_MAP['invoice'];
      if (target) navToAndOpen(target.page, target.key);
      return;
    }
    if (!APP.editMode) { showToast('Enable Edit Mode first', 'warning'); return; }
    _fabLoadPartiesThen(type);
  }
  var _fabParties = [];
  var _fabPartiesLoaded = false;
  function _fabLoadPartiesThen(type) {
    if (_fabPartiesLoaded) { _fabOpenModal(type); return; }
    API.run
      .withSuccessHandler(function (r) {
        if (r && r.success) _fabParties = r.data || [];
        _fabPartiesLoaded = true;
        _fabOpenModal(type);
      })
      .withFailureHandler(function () { _fabOpenModal(type); })
      .purGetPartiesForDropdown();
  }
  function _fabOpenModal(type) {
    var partyOpts = _fabParties.map(function (p) {
      var n = String(p.partyName || ''), id = p.partyId || '', ar = p.area || '';
      return '<option value="' + n + '" data-id="' + id + '" data-area="' + ar + '">' + n + '</option>';
    }).join('');
    var fs = 'margin-top:4px;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;width:100%;font-family:Poppins,sans-serif;font-size:16px;outline:none;box-sizing:border-box';
    var lb = 'display:block;font-size:11.5px;font-weight:600;color:#374151;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px';
    function fld(id, tp, ph, ex) { return '<input id="' + id + '" type="' + (tp || 'text') + '" placeholder="' + (ph || '') + '" style="' + fs + '" ' + (ex || '') + '/>'; }
    function sel(id, cont, ch) { return '<select id="' + id + '" style="' + fs + '" ' + (ch ? 'onchange="' + ch + '"' : '') + '>' + cont + '</select>'; }
    function fg(lbl, html) { return '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px"><label style="' + lb + '">' + lbl + '</label>' + html + '</div>'; }
    function row2(a, b) { return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' + a + b + '</div>'; }
    function idr(inp, btn) { return '<div style="display:flex;gap:8px;align-items:center">' + inp + btn + '</div>'; }
    function ro(id, ph) { return '<input id="' + id + '" type="text" readonly placeholder="' + (ph || '') + '" style="' + fs + ';background:#f9fafb;color:#6b7280"/>'; }
    function genBtn(fn) { return '<button class="btn btn-secondary btn-sm" onclick="' + fn + '"><i class="fas fa-rotate-right"></i> Gen</button>'; }
    function today() { var t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
    if (type === 'party') {
      var ptOpts = '<option value="">Select...</option><option>Supplier</option><option>Customer</option><option>Both</option>';
      openModal('Add New Party',
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">'
        + '<div style="grid-column:1/-1">' + fg('Party ID', idr(ro('_fabPartId', 'Click Gen'), genBtn('_fabPartGenId()'))) + '</div>'
        + fg('Party Name *', fld('_fabPartName', 'text', 'Name'))
        + fg('Party Type *', sel('_fabPartType', ptOpts))
        + fg('Area', fld('_fabPartArea', 'text', 'Area'))
        + fg('Owner Name', fld('_fabPartOwner', 'text', 'Owner'))
        + fg('Mobile', fld('_fabPartMobile', 'text', 'Mobile'))
        + fg('Labour 999', fld('_fabPartL999', 'number', '0'))
        + fg('Labour 925', fld('_fabPartL925', 'number', '0'))
        + fg('Labour Other', fld('_fabPartLOth', 'number', '0'))
        + fg('Outstanding ?', fld('_fabPartBalR', 'number', '0'))
        + fg('Outstanding g', fld('_fabPartBalG', 'number', '0'))
        + '<div style="grid-column:1/-1">' + fg('Note', fld('_fabPartNote', 'text', 'Optional')) + '</div>'
        + '</div>',
        '<button class="btn btn-secondary" onclick="closeModal()"><i class="fas fa-xmark"></i> Close</button>' +
        '<button class="btn btn-primary" onclick="_fabSaveParty()"><i class="fas fa-save"></i> Save</button>');
      _fabPartGenId(); return;
    }
    if (type === 'purchase') {
      var pOpts = '<option value="">Select Party...</option>' + partyOpts;
      openModal('Add New Purchase',
        fg('Purchase ID', idr(ro('_fabPurId', 'Click Gen'), genBtn('_fabPurGenId()'))) +
        row2(fg('Date *', fld('_fabDate', 'date')), fg('Party *', sel('_fabPurPN', pOpts, '_fabPurFetch()'))) +
        row2(fg('Party ID', ro('_fabPurPID')), fg('Area', ro('_fabPurArea'))) +
        row2(fg('Grams *', '<input id="_fabG" type="number" step="0.001" placeholder="0.000" oninput="_fabCalcPurRate()" style="' + fs + '">'),
          fg('Rupees *', '<input id="_fabR" type="number" step="0.01" placeholder="0.00" oninput="_fabCalcPurRate()" style="' + fs + '">')) +
        fg('Rate/10g (Auto)', ro('_fabRate10', 'Auto')) +
        fg('Note', fld('_fabNote', 'text', 'Optional')),
        '<button class="btn btn-secondary" onclick="closeModal()"><i class="fas fa-xmark"></i> Close</button>' +
        '<button class="btn btn-primary" onclick="_fabSavePurchase()"><i class="fas fa-save"></i> Save</button>');
      document.getElementById('_fabDate').value = today(); _fabPurGenId(); return;
    }
    if (type === 'sale') {
      var sOpts = '<option value="">Select Party...</option>' + partyOpts;
      openModal('Add New Sale',
        fg('Sale ID', idr(ro('_fabSaleId', 'Click Gen'), genBtn('_fabSaleGenId()'))) +
        row2(fg('Date *', fld('_fabSDate', 'date')), fg('Party *', sel('_fabSPN', sOpts, '_fabSaleFetch()'))) +
        row2(fg('Party ID', ro('_fabSPID')), fg('Area', ro('_fabSArea'))) +
        row2(fg('Grams *', '<input id="_fabSG" type="number" step="0.001" placeholder="0.000" oninput="_fabCalcSaleRate()" style="' + fs + '">'),
          fg('Rupees *', '<input id="_fabSR" type="number" step="0.01" placeholder="0.00" oninput="_fabCalcSaleRate()" style="' + fs + '">')) +
        row2(fg('Sale Rate/10g (Auto)', ro('_fabSRate10', 'Auto')), fg('Avg Purchase Rate', ro('_fabSAvg', ''))) +
        row2(fg('Profit ? (Auto)', ro('_fabSProR', '')), fg('Profit % (Auto)', ro('_fabSProP', ''))) +
        fg('Note', fld('_fabSNote', 'text', 'Optional')),
        '<button class="btn btn-secondary" onclick="closeModal()"><i class="fas fa-xmark"></i> Close</button>' +
        '<button class="btn btn-primary" onclick="_fabSaveSale()"><i class="fas fa-save"></i> Save</button>');
      document.getElementById('_fabSDate').value = today(); _fabSaleGenId();
      API.run.withSuccessHandler(function (r) { if (r && r.success) { document.getElementById('_fabSAvg').value = r.avgRate || 0; _fabCalcSaleRate(); } }).saleGetCalcData();
      return;
    }
    if (type === 'payment') {
      var rOpts = '<option value="">Select Party...</option>' + partyOpts;
      var tBtns = '<div style="display:flex;gap:8px;margin-bottom:4px">'
        + '<button type="button" id="_fabTypeRcpt" onclick="_fabSetType(\'Receipt\')" style="flex:1;padding:10px;border:2px solid #0d9488;border-radius:8px;background:#0d9488;color:#fff;font-size:13px;font-weight:600;cursor:pointer"><i class="fas fa-arrow-down"></i> Receipt</button>'
        + '<button type="button" id="_fabTypePay" onclick="_fabSetType(\'Payment\')" style="flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:8px;background:#f9fafb;color:#6b7280;font-size:13px;font-weight:500;cursor:pointer"><i class="fas fa-arrow-up"></i> Payment</button>'
        + '</div>';
      openModal('New Receipt / Payment',
        fg('Type', tBtns) +
        fg('ID', idr(ro('_fabPayId', 'Click Gen'), genBtn('_fabPayGenId()'))) +
        row2(fg('Date *', fld('_fabPyDate', 'date')), fg('Party *', sel('_fabPyPN', rOpts, '_fabPayFetch()'))) +
        row2(fg('Party ID', ro('_fabPyPID')), fg('Area', ro('_fabPyArea'))) +
        row2(fg('Rupees ?', fld('_fabPyR', 'number', '0.00')), fg('Grams (g)', fld('_fabPyG', 'number', '0.000'))) +
        fg('Note', fld('_fabPyNote', 'text', 'Optional')),
        '<button class="btn btn-secondary" onclick="closeModal()"><i class="fas fa-xmark"></i> Close</button>' +
        '<button class="btn btn-primary" onclick="_fabSavePayment()"><i class="fas fa-save"></i> Save</button>');
      document.getElementById('_fabPyDate').value = today();
      _fabPayGenId();
      window._fabEntryType = 'Receipt';
      return;
    }
  }
  function _fabGenId(pfx) { return pfx + Math.floor(10000 + Math.random() * 90000); }
  function _fabPartGenId() { var el = document.getElementById('_fabPartId'); if (el) el.value = _fabGenId('P'); }
  function _fabPurGenId() { var el = document.getElementById('_fabPurId'); if (el) el.value = _fabGenId('P'); }
  function _fabSaleGenId() { var el = document.getElementById('_fabSaleId'); if (el) el.value = _fabGenId('S'); }
  function _fabPayGenId() { var el = document.getElementById('_fabPayId'); if (el) el.value = _fabGenId('R'); }
  function _fabPurFetch() { var s = document.getElementById('_fabPurPN'), o = s && s.options[s.selectedIndex]; if (!o) return; document.getElementById('_fabPurPID').value = o.getAttribute('data-id') || ''; document.getElementById('_fabPurArea').value = o.getAttribute('data-area') || ''; }
  function _fabSaleFetch() { var s = document.getElementById('_fabSPN'), o = s && s.options[s.selectedIndex]; if (!o) return; document.getElementById('_fabSPID').value = o.getAttribute('data-id') || ''; document.getElementById('_fabSArea').value = o.getAttribute('data-area') || ''; }
  function _fabPayFetch() { var s = document.getElementById('_fabPyPN'), o = s && s.options[s.selectedIndex]; if (!o) return; document.getElementById('_fabPyPID').value = o.getAttribute('data-id') || ''; document.getElementById('_fabPyArea').value = o.getAttribute('data-area') || ''; }
  function _fabCalcPurRate() {
    var g = parseFloat(document.getElementById('_fabG').value) || 0, r = parseFloat(document.getElementById('_fabR').value) || 0;
    var el = document.getElementById('_fabRate10'); if (el) el.value = g ? ((r / g) * 10).toFixed(2) : '';
  }
  function _fabCalcSaleRate() {
    var g = parseFloat(document.getElementById('_fabSG').value) || 0, r = parseFloat(document.getElementById('_fabSR').value) || 0;
    var avg = parseFloat(document.getElementById('_fabSAvg').value) || 0;
    var rate10 = g ? ((r / g) * 10) : 0;
    var el = document.getElementById('_fabSRate10'); if (el) el.value = rate10.toFixed(2);
    var profR = (r - (avg / 10 * g)), profP = avg ? ((profR / r) * 100) : 0;
    var elR = document.getElementById('_fabSProR'); if (elR) elR.value = profR.toFixed(2);
    var elP = document.getElementById('_fabSProP'); if (elP) elP.value = profP.toFixed(2);
  }
  function _fabSetType(type) {
    window._fabEntryType = type;
    var aS = 'flex:1;padding:10px;border:2px solid #0d9488;border-radius:8px;background:#0d9488;color:#fff;font-size:13px;font-weight:600;cursor:pointer';
    var iS = 'flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:8px;background:#f9fafb;color:#6b7280;font-size:13px;font-weight:500;cursor:pointer';
    var r = document.getElementById('_fabTypeRcpt'), p = document.getElementById('_fabTypePay');
    if (r) r.style.cssText = (type === 'Receipt' ? aS : iS);
    if (p) p.style.cssText = (type === 'Payment' ? aS : iS);
  }
  function _fabSaveParty() {
    var id = (document.getElementById('_fabPartId').value || '').trim();
    var nm = (document.getElementById('_fabPartName').value || '').trim();
    var tp = (document.getElementById('_fabPartType').value || '').trim();
    if (!id) { showToast('Generate an ID first', 'warning'); return; }
    if (!nm) { showToast('Party Name required', 'warning'); return; }
    if (!tp) { showToast('Party Type required', 'warning'); return; }
    var payload = { partyId: id, partyName: nm, partyType: tp, area: (document.getElementById('_fabPartArea').value || '').trim(), ownerName: (document.getElementById('_fabPartOwner').value || '').trim(), mobileNumber: (document.getElementById('_fabPartMobile').value || '').trim(), labour999: document.getElementById('_fabPartL999').value || '', labour925: document.getElementById('_fabPartL925').value || '', labourOther: document.getElementById('_fabPartLOth').value || '', outstandingRupees: document.getElementById('_fabPartBalR').value || '0', outstandingGrams: document.getElementById('_fabPartBalG').value || '0', note: (document.getElementById('_fabPartNote').value || '').trim() };
    closeModal(); showLoader();
    API.run.withSuccessHandler(function (r) { hideLoader(); if (r && r.success) { showToast('Party Added', 'success'); _fabPartiesLoaded = false; } else showToast((r && r.message) || 'Error', 'error'); }).withFailureHandler(function (e) { hideLoader(); showToast(e.message, 'error'); }).partAddParty(payload);
  }
  function _fabSavePurchase() {
    var id = (document.getElementById('_fabPurId').value || '').trim();
    var dt = document.getElementById('_fabDate').value;
    var pn = document.getElementById('_fabPurPN').value;
    var g = parseFloat(document.getElementById('_fabG').value) || 0;
    var r = parseFloat(document.getElementById('_fabR').value) || 0;
    if (!id) { showToast('Generate an ID first', 'warning'); return; }
    if (!dt) { showToast('Date required', 'warning'); return; }
    if (!pn) { showToast('Select a Party', 'warning'); return; }
    if (!g && !r) { showToast('Enter Grams or Rupees', 'warning'); return; }
    var payload = { purchaseId: id, date: dt, partyId: document.getElementById('_fabPurPID').value, partyName: pn, area: document.getElementById('_fabPurArea').value, grams: g, rupees: r, note: (document.getElementById('_fabNote').value || '').trim() };
    closeModal(); showLoader();
    API.run.withSuccessHandler(function (res) { hideLoader(); if (res && res.success) { showToast('Purchase Added', 'success'); } else showToast((res && res.message) || 'Error', 'error'); }).withFailureHandler(function (e) { hideLoader(); showToast(e.message, 'error'); }).purAddPurchase(payload);
  }
  function _fabSaveSale() {
    var id = (document.getElementById('_fabSaleId').value || '').trim();
    var dt = document.getElementById('_fabSDate').value;
    var pn = document.getElementById('_fabSPN').value;
    var g = parseFloat(document.getElementById('_fabSG').value) || 0;
    var r = parseFloat(document.getElementById('_fabSR').value) || 0;
    if (!id) { showToast('Generate an ID first', 'warning'); return; }
    if (!dt) { showToast('Date required', 'warning'); return; }
    if (!pn) { showToast('Select a Party', 'warning'); return; }
    if (!g && !r) { showToast('Enter Grams or Rupees', 'warning'); return; }
    var payload = { saleId: id, date: dt, partyId: document.getElementById('_fabSPID').value, partyName: pn, area: document.getElementById('_fabSArea').value, grams: g, rupees: r, note: (document.getElementById('_fabSNote').value || '').trim() };
    closeModal(); showLoader();
    API.run.withSuccessHandler(function (res) { hideLoader(); if (res && res.success) { showToast('Sale Added', 'success'); } else showToast((res && res.message) || 'Error', 'error'); }).withFailureHandler(function (e) { hideLoader(); showToast(e.message, 'error'); }).saleAddSale(payload);
  }
  function _fabSavePayment() {
    var id = (document.getElementById('_fabPayId').value || '').trim();
    var dt = document.getElementById('_fabPyDate').value;
    var pn = document.getElementById('_fabPyPN').value;
    var rr = parseFloat(document.getElementById('_fabPyR').value) || 0;
    var gr = parseFloat(document.getElementById('_fabPyG').value) || 0;
    var et = window._fabEntryType || 'Receipt';
    if (!id) { showToast('Generate an ID first', 'warning'); return; }
    if (!dt) { showToast('Date required', 'warning'); return; }
    if (!pn) { showToast('Select a Party', 'warning'); return; }
    if (!rr && !gr) { showToast('Enter Rupees or Grams', 'warning'); return; }
    var payload = { receiptId: id, date: dt, partyId: document.getElementById('_fabPyPID').value, partyName: pn, area: document.getElementById('_fabPyArea').value, rupeesReceived: rr, gramsReceived: gr, entryType: et, note: (document.getElementById('_fabPyNote').value || '').trim() };
    closeModal(); showLoader();
    API.run.withSuccessHandler(function (res) { hideLoader(); if (res && res.success) { showToast(et + ' Added', 'success'); } else showToast((res && res.message) || 'Error', 'error'); }).withFailureHandler(function (e) { hideLoader(); showToast(e.message, 'error'); }).rcptAddReceipt(payload);
  }
  function _appBaseUrl_() {
    var base = '';
    if (typeof SCRIPT_URL !== 'undefined' && SCRIPT_URL && SCRIPT_URL.length > 10 && SCRIPT_URL.indexOf('script.google.com') !== -1) {
      base = SCRIPT_URL.split('?')[0];
    } else {
      var href = '';
      try { href = window.top.location.href; } catch (e) { }
      if (!href) href = window.location.href;
      base = href.split('?')[0];
    }
    return base;
  }
  function _appPageUrl_(page, params) {
    params = params || {};
    var q = [];
    Object.keys(params).forEach(function (key) {
      if (params[key] !== undefined && params[key] !== null && params[key] !== '') {
        q.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
      }
    });
    if (typeof APP !== 'undefined' && APP.routerMode === 'static') {
      var path = page === 'dashboard' ? '/' : '/' + encodeURIComponent(page);
      return path + (q.length ? '?' + q.join('&') : '');
    }
    var base = _appBaseUrl_();
    if (!base || base.length < 5) return '';

    wrap.innerHTML =
      '<input class="party-combo-inp" id="' + inputId + '" type="text" placeholder="' + placeholder + '" autocomplete="off"/>' +
      '<button type="button" class="party-combo-clear" tabindex="-1"><i class="fas fa-xmark"></i></button>';

    var inp = wrap.querySelector('.party-combo-inp');
    var clr = wrap.querySelector('.party-combo-clear');

    /* Portal dropdown to <body> so modal overflow:hidden cannot clip it */
    var drop = document.createElement('div');
    drop.className = 'party-combo-drop party-combo-portal';
    document.body.appendChild(drop);

    var _selected = null;
    var _focusIdx = -1;
    var _open = false;
    var _destroyed = false;

    function reposition() {
      var r = inp.getBoundingClientRect();
      var spaceBelow = window.innerHeight - r.bottom;
      drop.style.width = r.width + 'px';
      drop.style.left = (r.left + window.scrollX) + 'px';
      if (spaceBelow >= 120) {
        drop.style.top = (r.bottom + window.scrollY + 4) + 'px';
        drop.style.bottom = 'auto';
      } else {
        drop.style.top = 'auto';
        drop.style.bottom = (window.innerHeight - r.top + 4) + 'px';
      }
    }

    function getFiltered(q) {
      var base = filter ? parties.filter(filter) : parties;
      if (!q) return base;
      var ql = q.toLowerCase();
      return base.filter(function (p) {
        return (p.partyName || '').toLowerCase().indexOf(ql) !== -1 ||
          (p.area || '').toLowerCase().indexOf(ql) !== -1;
      });
    }

    function renderDrop(q) {
      var list = getFiltered(q);
      if (!list.length) {
        drop.innerHTML = '<div class="party-combo-empty"><i class="fas fa-search" style="margin-right:6px"></i>' +
          (q ? 'No match for "' + _htmlEsc(q) + '"' : 'No parties available') + '</div>';
      } else {
        drop.innerHTML = list.map(function (p, i) {
          return '<div class="party-combo-item" data-idx="' + i + '">' +
            '<span class="party-combo-item-name">' + _htmlEsc(p.partyName) + '</span>' +
            '<span class="party-combo-item-sub">' + _htmlEsc(p.area || '') +
            (p.partyType ? ' \u00b7 ' + _htmlEsc(p.partyType) : '') + '</span>' +
            '</div>';
        }).join('');
        drop.querySelectorAll('.party-combo-item').forEach(function (el, i) {
          el.addEventListener('mousedown', function (e) { e.preventDefault(); selectByIndex(i, list); });
        });
      }
      _focusIdx = -1;
    }

    function selectByIndex(i, list) {
      list = list || getFiltered(inp.value.trim());
      var p = list[i];
      if (!p) return;
      _selected = p;
      inp.value = p.partyName;
      inp.style.borderColor = '';
      inp.style.boxShadow = '';
      clr.style.display = 'inline-flex';
      closeDrop();
      onSelect(p);
    }

    function openDrop() {
      if (_destroyed) return;
      renderDrop(inp.value.trim());
      drop.classList.add('open');
      _open = true;
      reposition();
    }

    function closeDrop() {
      drop.classList.remove('open');
      _open = false;
      _focusIdx = -1;
    }

    function moveFocus(dir) {
      var items = drop.querySelectorAll('.party-combo-item');
      if (!items.length) return;
      _focusIdx = Math.max(0, Math.min(_focusIdx + dir, items.length - 1));
      items.forEach(function (el, i) { el.classList.toggle('focused', i === _focusIdx); });
      if (items[_focusIdx]) items[_focusIdx].scrollIntoView({ block: 'nearest' });
    }

    /* Reject typed text that wasn't picked from the list */
    function rejectInvalid() {
      if (inp.value.trim() && !_selected) {
        inp.style.borderColor = '#ef4444';
        inp.style.boxShadow = '0 0 0 3px rgba(239,68,68,.18)';
        inp.style.animation = 'partyComboShake .35s ease';
        setTimeout(function () {
          inp.value = '';
          clr.style.display = 'none';
          inp.style.borderColor = '';
          inp.style.boxShadow = '';
          inp.style.animation = '';
        }, 380);
      }
    }

    inp.addEventListener('input', function () {
      var q = inp.value.trim();
      clr.style.display = q ? 'inline-flex' : 'none';
      if (_selected && _selected.partyName !== inp.value) { _selected = null; onSelect(null); }
      inp.style.borderColor = '';
      inp.style.boxShadow = '';
      openDrop();
    });

    inp.addEventListener('focus', function () { openDrop(); });

    inp.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (!_open) openDrop(); else moveFocus(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (_open && _focusIdx >= 0) {
          selectByIndex(_focusIdx, getFiltered(inp.value.trim()));
        } else if (_open) {
          var lst = getFiltered(inp.value.trim());
          if (lst.length === 1) selectByIndex(0, lst);
        }
      } else if (e.key === 'Escape') { closeDrop(); }
    });

    inp.addEventListener('blur', function () {
      setTimeout(function () {
        closeDrop();
        rejectInvalid();
      }, 200);
    });

    clr.addEventListener('mousedown', function (e) {
      e.preventDefault();
      inp.value = '';
      clr.style.display = 'none';
      inp.style.borderColor = '';
      inp.style.boxShadow = '';
      _selected = null;
      onSelect(null);
      closeDrop();
      inp.focus();
    });

    var _reposH = function () { if (_open) reposition(); };
    window.addEventListener('scroll', _reposH, true);
    window.addEventListener('resize', _reposH);

    var _docH = function (e) {
      if (!wrap.contains(e.target) && !drop.contains(e.target)) closeDrop();
    };
    document.addEventListener('click', _docH);

    var api = {
      getValue: function () { return _selected ? _selected.partyName : inp.value.trim(); },
      getSelected: function () { return _selected; },
      setValue: function (partyName) {
        inp.value = partyName || '';
        clr.style.display = partyName ? 'inline-flex' : 'none';
        _selected = parties.find(function (p) { return p.partyName === partyName; }) || null;
      },
      clearValue: function () {
        inp.value = '';
        clr.style.display = 'none';
        inp.style.borderColor = '';
        inp.style.boxShadow = '';
        _selected = null;
      },
      setParties: function (np) { parties = np; },
      setFilter: function (fn) { filter = fn; },
      focus: function () { inp.focus(); },
      destroy: function () {
        if (_destroyed) return;
        _destroyed = true;
        closeDrop();
        if (drop.parentNode) drop.parentNode.removeChild(drop);
        window.removeEventListener('scroll', _reposH, true);
        window.removeEventListener('resize', _reposH);
        document.removeEventListener('click', _docH);
      }
    };
    window.__partyCombos = window.__partyCombos || [];
    window.__partyCombos.push(api);
    return api;
  }
  function destroyPartyCombos() {
    var list = window.__partyCombos || [];
    for (var i = 0; i < list.length; i++) {
      try { list[i].destroy(); } catch (e) { }
    }
    window.__partyCombos = [];
  }
</script>
